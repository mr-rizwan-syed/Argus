# Publishes a GitHub Release with the Linux x86-64 binary whenever a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# The binary is built with the same Go version and flags as the one committed in bin/, so it is byte-identical to it
# when the source is the same. GitHub's own token is used; no secrets are needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to exact commits, not floating tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.0"
          cache: false

      - name: Build
        run: |
          set -euo pipefail
          go version
          mkdir dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "-s -w" -o dist/argus-linux-amd64 ./cmd/argus
          (cd dist && sha256sum argus-linux-amd64 > SHA256SUMS && cat SHA256SUMS)

      - name: Smoke test
        run: |
          set -euo pipefail
          ./dist/argus-linux-amd64 -h 2>&1 | grep -q -- "-resume"

      - name: Compare with the binary committed in bin/
        run: |
          if cmp -s dist/argus-linux-amd64 bin/argus-linux-amd64; then
            echo "byte-identical to bin/argus-linux-amd64"
          else
            echo "::notice::differs from bin/argus-linux-amd64 (the source changed since that binary was committed)"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/argus-linux-amd64 dist/SHA256SUMS \
            --verify-tag --title "Argus $GITHUB_REF_NAME" --notes-file .github/release-notes.md
